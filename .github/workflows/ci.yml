name: Backend CI/CD

on:
  push:
    branches:
      - development
      - staging
      - production

# Auto-cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fitnest-backend/user-service
  HELM_REPO_URL: git@github.com:fitnest-chart/user-service.git
  HELM_VALUES_FILE: values.yaml

jobs:
# -------------------------
# Build Job
# -------------------------
  build:
    name: Build
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      
      - name: Gradle build
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          echo "Starting Gradle build"
          ./gradlew --version
          ./gradlew clean build -x test --no-daemon --no-build-cache --max-workers 1
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

# -------------------------
# Docker Build Job
# -------------------------
  docker-build:
    name: Docker Build & Push
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      # ✅ CRITICAL: Set up Docker Buildx with docker-container driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

# -------------------------
# Helm Chart Update Job
# -------------------------
  update-helm-chart:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      github.ref_name == 'development' ||
      github.ref_name == 'staging' ||
      github.ref_name == 'production'
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client wget
          # Install yq v4
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version
      
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      - name: Configure Git
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
      
      - name: Configure SSH
        run: |
          if [ -z "${{ secrets.CHART_REPO_SSH_PRIVATE_KEY_B64 }}" ]; then
            echo "❌ Missing CHART_REPO_SSH_PRIVATE_KEY_B64 secret"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "${{ secrets.CHART_REPO_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      
      - name: Clone Helm repository
        run: git clone $HELM_REPO_URL helm-repo
      
      - name: Update Helm values
        run: |
          echo "Updating Helm chart for branch: ${{ github.ref_name }}"
          cd helm-repo
          git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
          
          # Update image tag
          yq eval -i '.image.tag = strenv(IMAGE_TAG)' $HELM_VALUES_FILE
          
          # Commit and push
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add $HELM_VALUES_FILE
            git commit -m "chore: update image tag to $IMAGE_TAG [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "✅ Helm chart updated successfully"
          fi


# -------------------------
# ArgoCD Sync Job
# -------------------------
  sync-argocd:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: update-helm-chart
    if: github.ref_name == 'development'
    
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 161.97.183.7 >> ~/.ssh/known_hosts
          
      - name: Trigger ArgoCD Sync
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@161.97.183.7 "kubectl patch application -n argocd fitnest-user-service-dev --type merge -p '{\"operation\": {\"sync\": {\"prune\": true}}}'"
