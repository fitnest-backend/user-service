name: Backend CI/CD

on:
  push:
    branches:
      - development
      - staging
      - production
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fitnest-backend/user-service
  HELM_VALUES_FILE: values.yaml

# =============================
# Docker Build & Push
# =============================
jobs:
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_BRANCH }}-${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_BRANCH }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
            type=gha,mode=max

# =============================
# Update Helm Chart Repo
# =============================
  update-helm-chart:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      github.ref_name == 'development' ||
      github.ref_name == 'staging' ||
      github.ref_name == 'production'

    steps:
      - name: Checkout Helm repo via SSH
        uses: actions/checkout@v4
        with:
          repository: fitnest-chart/user-service
          ref: ${{ github.ref_name }}
          path: helm-repo
          ssh-key: ${{ secrets.CHART_REPO_SSH_PRIVATE_KEY }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          cd helm-repo
          git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}

          # Construct the full tag matching the docker-build step: branch-sha
          FULL_TAG="${{ github.ref_name }}-${IMAGE_TAG}"
          echo "Updating image tag to: $FULL_TAG"
          
          # Update the values.yaml with the full tag
          yq eval -i ".image.tag = \"$FULL_TAG\"" $HELM_VALUES_FILE

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.email "ci@github.com"
            git config user.name "GitHub Actions"
            git add $HELM_VALUES_FILE
            git commit -m "chore: update image tag to $IMAGE_TAG [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "Helm chart updated successfully"
          fi

# =============================
# Trigger ArgoCD Sync (dev only)
# =============================
  sync-argocd:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: update-helm-chart
    if: github.ref_name == 'development'

    steps:
      - name: Trigger ArgoCD Sync
        run: |
          curl -k -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            http://161.97.183.7:31052/api/v1/applications/fitnest-user-service-dev/sync
