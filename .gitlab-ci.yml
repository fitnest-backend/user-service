stages:
  - build
  - docker
  - update-helm-chart

variables:
  IMAGE_NAME: registry.gitlab.com/fitnest-organization/backend/user-service
  HELM_REPO_URL: git@gitlab.com:fitnest-organization/chart/user-service.git
  HELM_REPO_BRANCH: development
  HELM_VALUES_FILE: values.yaml

before_script:
  - echo "Starting job $CI_JOB_NAME"

# -----------------------------
# Stage 1: Build the Java JAR
# -----------------------------
build:
  stage: build
  image: gradle:8.3.3-jdk17
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --version
    - gradle clean build -x test --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

# -----------------------------
# Stage 2: Build & Push Docker Image
# -----------------------------
docker-build:
  stage: docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Logging into GitLab registry"
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token $CI_REGISTRY --password-stdin
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - echo "IMAGE_TAG=$IMAGE_TAG" > image.env
  artifacts:
    reports:
      dotenv: image.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  dependencies:
    - build

# -----------------------------
# Stage 3: Update Helm Chart
# -----------------------------
update-helm-chart:
  stage: update-helm-chart
  image: alpine:3.19
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache git yq openssh-client coreutils bash
  script:
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - echo "Updating Helm chart with image tag $IMAGE_TAG"
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    # SSH setup
    - test -n "$CHART_REPO_SSH_PRIVATE_KEY_B64" || (echo "missing CHART_REPO_SSH_PRIVATE_KEY_B64"; exit 1)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$CHART_REPO_SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' | ssh-add -
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Clone & update chart
    - git clone "$HELM_REPO_URL"
    - cd user-service
    - git checkout $CI_COMMIT_BRANCH || git checkout -b $CI_COMMIT_BRANCH
    - yq eval ".image.tag = \"$IMAGE_TAG\"" -i $HELM_VALUES_FILE
    - git add $HELM_VALUES_FILE
    - git commit -m "chore: update image tag to $IMAGE_TAG"
    - git push origin $CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "production"'
  dependencies:
    - docker-build