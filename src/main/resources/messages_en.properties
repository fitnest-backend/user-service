# Validation Errors
error.validation = An error occurred during data validation
error.invalid_field = The entered data is invalid
error.missing_field = A required field was not provided
error.out_of_range = The entered value is outside the allowed range
error.invalid_format = The data format is invalid

# Authentication Errors
error.unauthorized = Please log in to continue
error.invalid_credentials = Username or password is incorrect
error.token_expired = The session has expired. Please log in again
error.account_locked = Your account has been temporarily locked
error.account_disabled = Your account has been disabled

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = The request JSON format is invalid
error.unsupported_media_type = This media type is not supported
error.method_not_allowed = This HTTP method is not supported

# Server Errors
error.internal_server_error = A technical error occurred. Please try again later
error.service_unavailable = The service is temporarily unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = Data not found
error.resource_already_exists = This data already exists
error.resource_conflict = A data conflict was detected

# Rate Limiting Errors
error.too_many_requests = Too many requests were sent. Please wait a moment
error.rate_limit_exceeded = The daily limit has been exceeded

# Application Errors
error.setup_not_finished = Account setup has not been completed
error.null_constraint = Required data is missing
error.confirmation_required = Confirmation must be set to 'true'
error.goal_reference_not_found = Goal reference not found
error.user_goal_not_set = No goal has been set for the user
error.invalid_language_code = Invalid language code: {0}
error.profile_not_found = Profile not found
error.invalid_gender = Invalid gender value
error.file_required = A file is required
error.file_size_limit = File size exceeds 5MB
error.only_images_allowed = Only image files are allowed