server:
  port: 9897

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitnest}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest}
    password: ${SPRING_DATASOURCE_PASSWORD:fitnest}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:fitnest_jwt_secret_key_at_least_32_characters_long_for_hs256}
  issuer: ${JWT_ISSUER:fitnest}

iam:
  service:
    url: ${IAM_SERVICE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized