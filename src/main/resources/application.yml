spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fit
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    enabled: false 

server:
  port: 9897

