server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json,application/vnd.oai.openapi+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200

spring:
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  application:
    name: user-backend   # ✅ Changed from user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-user:5432/fitnest_user}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:user_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keep-alive-time: 300000
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      pool-name: HikariCP-User
      auto-commit: true
      connection-test-query: SELECT 1
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service.fitnest-dev.svc.cluster.local:9092}
    consumer:
      group-id: user-backend   # ✅ Updated group-id
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: az.fitnest.user.dto.event.UserSetupCompletedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record
      concurrency: 1

  cloud:
    openfeign:
      cache:
        enabled: false
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}

# ✅ Updated service URL
identity:
  backend:
    url: ${IDENTITY_BACKEND_URL:http://identity-backend:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    db: ${APP_WARMUP_DB:true}
    jwks: ${APP_WARMUP_JWKS:true}

springdoc:
  server-url: ${SPRINGDOC_SERVER_URL:}
  api-docs:
    path: /v3/api-docs
    cache:
      enabled: true
    pre-loading-enabled: true
  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    az.fitnest.user: ${LOGGING_LEVEL_AZ_FITNEST_USER:DEBUG}
    az.fitnest.order: ${LOGGING_LEVEL_AZ_FITNEST_ORDER:DEBUG}
    az.fitnest: ${LOGGING_LEVEL_AZ_FITNEST:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:DEBUG}
    feign.Logger: ${LOGGING_LEVEL_FEIGN_LOGGER:OFF}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  file:
    name: logs/user-backend.log   # ✅ Updated log file name
    max-size: 10MB
    max-history: 30

grpc:
  server:
    port: 9090
  client:
    # ✅ Updated gRPC clients to -backend
    identity-backend:
      address: 'static://identity-backend:9090'
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
      enable-keep-alive: true
      keep-alive-without-calls: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      deadline-after: 10s
    storage-backend:
      address: 'dns:///storage-backend.fitnest-dev.svc.cluster.local:9090'
      negotiation-type: plaintext
    notifications-backend:
      address: 'static://notifications-backend:9090'
      negotiation-type: plaintext
    order-backend:
      address: ${ORDER_BACKEND_GRPC_ADDRESS:dns:///order-backend.fitnest-dev.svc.cluster.local:9090}
      negotiation-type: plaintext
      deadline-after: 10s
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s