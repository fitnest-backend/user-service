syntax = "proto3";

package az.fitnest.identity;

option java_multiple_files = true;
option java_package = "az.fitnest.identity.grpc";
option java_outer_classname = "IdentityAnalyticsProto";

service IdentityAnalyticsService {
  rpc GetActiveUsersKpi(GetActiveUsersKpiRequest) returns (ActiveUsersKpiResponse);
  rpc GetCustomerGrowth(GetCustomerGrowthRequest)  returns (CustomerGrowthResponse);
}

message GetActiveUsersKpiRequest {}

message ActiveUsersKpiResponse {
  int64  current_total     = 1;
  double percentage_change = 2;
}

message GetCustomerGrowthRequest {
  string period = 1; // "MONTHLY" | "WEEKLY"
}

message GrowthPoint {
  string period_label     = 1;
  int64  new_customers    = 2;
  int64  active_customers = 3;
}

message CustomerGrowthResponse {
  repeated GrowthPoint data_points        = 1;
  double               overall_growth_pct = 2;
}