syntax = "proto3";

package az.fitnest.order;

option java_multiple_files = true;
option java_package = "az.fitnest.order.grpc";
option java_outer_classname = "UserSubscriptionProto";

service UserSubscriptionService {
  rpc GetActiveSubscription(GetActiveSubscriptionRequest) returns (ActiveSubscriptionResponse);
  rpc GetUserIdsByPackageId(GetUserIdsByPackageIdRequest) returns (GetUserIdsByPackageIdResponse);
  rpc GetUserIdsByDurationMonths(GetUserIdsByDurationMonthsRequest) returns (GetUserIdsByPackageIdResponse);
  rpc GetUserIdsByType(GetUserIdsByTypeRequest) returns (GetUserIdsByPackageIdResponse);
  rpc AssignSubscriptionToUser(AssignSubscriptionToUserRequest) returns (AssignSubscriptionToUserResponse);
  rpc GetSubscriptionStatistics(GetSubscriptionStatisticsRequest) returns (SubscriptionStatisticsResponse);
  rpc GetFilteredUserIds(GetFilteredUserIdsRequest) returns (GetUserIdsByPackageIdResponse);
}

message AssignSubscriptionToUserRequest {
  int64 user_id = 1;
  int64 plan_id = 2;
  int64 option_id = 3;
  bool auto_payment_enabled = 4;
}

message AssignSubscriptionToUserResponse {
  int64 subscription_id = 1;
  int64 user_id = 2;
}

message GetActiveSubscriptionRequest {
  int64 user_id = 1;
}

message ActiveSubscriptionResponse {
  string package_name = 1;
  string subscription_status = 2;  // ACTIVE, FROZEN, or empty for no subscription
  int64 package_id = 3;
  int32 total_limit = 4;
  int32 remaining_limit = 5;
  string expires_at = 6;
}

message GetUserIdsByPackageIdRequest {
  int64 package_id = 1;
}

message GetUserIdsByPackageIdResponse {
  repeated int64 user_ids = 1;
}

message GetUserIdsByDurationMonthsRequest {
  int32 duration_months = 1;
}

message GetUserIdsByTypeRequest {
  string type = 1;
}

message GetSubscriptionStatisticsRequest {}

message SubscriptionStatisticsResponse {
  int64 users_last_7_days = 1;
  int64 users_finished = 2;
  int64 users_active_or_frozen = 3;
}

message GetFilteredUserIdsRequest {
  int64 package_id = 1;
  int32 duration_months = 2;
  string subscription_status = 3; // ACTIVE, FINISHED, FROZEN, LAST_7_DAYS
  string sort_by = 4; // FINISH_DATE_ASC, FINISH_DATE_DESC
}
