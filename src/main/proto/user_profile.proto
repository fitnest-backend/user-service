syntax = "proto3";

package az.fitnest.user;

option java_multiple_files = true;
option java_package = "az.fitnest.user.grpc";
option java_outer_classname = "UserProfileProto";

service UserProfileService {
  rpc GetUserProfileDetails(UserProfileDetailsRequest) returns (UserProfileDetailsResponse);
  rpc UpdateProfileImage(UpdateProfileImageDetailsRequest) returns (UserProfileDetailsStatus);
  rpc GetUserByEmail(UserByEmailRequest) returns (UserProfileDetailsResponse);
  rpc CreateUserProfile(CreateProfileRequest) returns (UserProfileDetailsStatus);
}

message UpdateProfileImageDetailsRequest {
  int64 user_id = 1;
  string image_url = 2;
}

message UserProfileDetailsStatus {
  bool success = 1;
}

message UserProfileDetailsRequest {
  int64 user_id = 1;
}

message UserByEmailRequest {
  string email = 1;
}

message CreateProfileRequest {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}

message UserProfileDetailsResponse {
  int64 user_id = 1;
  string registration_date = 2;
  string platform = 3;
  string phone_number = 4;
  string email = 5;
  string birth_date = 6;
  string goal = 7;
  double height = 8;
  double weight = 9;
  double bmi_index = 10;
  string profile_image_url = 11;
  string first_name = 12;
  string last_name = 13;
}
